run_id: starvla
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]

framework:
  name: RynnBrainOFT
  qwenvl:
    base_vlm: /home/user01/jiangnan/starVLA/playground/Pretrained_models/RynnBrain-CoP-8B
    attn_implementation: flash_attention_2
    memory: true
    max_memory_step: 5
  dino:
    dino_backbone: dinov2_vits14
  action_model:
    action_model_type: L1RegressionActionHead
    action_hidden_dim: 4096
    action_dim: 7
    state_dim: 7
    future_action_window_size: 7
    past_action_window_size: 0
    num_actions_chunk: 8
    use_pro_version: true
  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/calvin
    data_mix: calvin_task_D_D
    action_type: delta_qpos
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    CoT_answer: bbox
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 4
    load_all_data_for_training: true
    obs: ["image_0"]
    video_backend: torchvision_av
    memory: true
    max_step: 5
    interval: 10
    num_workers: 0

trainer:
  max_train_steps: 30000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  freeze_modules: ''
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true